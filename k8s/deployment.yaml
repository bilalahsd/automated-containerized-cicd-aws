apiVersion: apps/v1
kind: Deployment
metadata:
  name: automated-dep-api
  namespace: automated-dep
spec:
  replicas: 2
  selector:
    matchLabels:
      app: automated-dep-api
  template:
    metadata:
      labels:
        app: automated-dep-api
    spec:
      containers:
        - name: api
          image: automated-dep-aws-api:latest
          ports:
            - containerPort: 3000

          envFrom:
            - configMapRef:
                name: automated-dep-api-config

          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"